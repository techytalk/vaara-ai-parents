# Deploy from repo root:
#   flyctl deploy . --config apps/realtime/fly.toml

app = "vaara-realtime"
primary_region = "sin"

[build]
  # Path is resolved relative to this fly.toml, while the build context
  # is the repo root (`flyctl deploy .`).
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  # Must match http_service.internal_port below.
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
